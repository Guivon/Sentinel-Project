name: android

on:
  push:
    paths: ['App Sentinel/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['App Sentinel/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App Sentinel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: App Sentinel

      - name: Write local.properties
        run: |
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}"
            echo "BACKEND_URL=${{ secrets.BACKEND_URL }}"
          } > local.properties

      - name: Unit tests, Android Lint and debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: App Sentinel/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  ktlint:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: App Sentinel
    steps:
      - uses: actions/checkout@v4
      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
      - name: Check style
        run: ./ktlint "app/src/**/*.kt"

  detekt:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: App Sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Detekt
        run: curl -sSLo detekt-cli.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
      - name: Static analysis
        run: java -jar detekt-cli.jar --input app/src/main/java --config config/detekt/detekt.yml --build-upon-default-config
